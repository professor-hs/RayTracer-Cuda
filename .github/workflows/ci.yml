name: CI & Deployment Pipeline

on:
  push:
    branches:
      - master
      - feat/gpu-engine-ui-deployment
  pull_request:
    branches:
      - master

jobs:
  frontend-build:
    name: Build & Verify Frontend Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Frontend Bundle
        working-directory: frontend
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend-test:
    name: Test Backend API & Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Automated Test Suite
        run: python -u backend/tests/test_api.py

  deploy-netlify:
    name: Deploy Frontend to Netlify
    needs: [frontend-build, backend-test]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feat/gpu-engine-ui-deployment'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "Deploying to Netlify using secret credentials..."
            npx --yes netlify-cli deploy --prod --dir=frontend/dist --auth="$NETLIFY_AUTH_TOKEN" --site="$NETLIFY_SITE_ID"
          elif [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            echo "Deploying to Netlify using auth token (creating or linking site)..."
            npx --yes netlify-cli deploy --prod --dir=frontend/dist --auth="$NETLIFY_AUTH_TOKEN"
          else
            echo "::notice::NETLIFY_AUTH_TOKEN secret is not yet configured in GitHub Secrets. Once added, automated CI/CD will deploy on every push."
            echo "You can also connect this repository directly in the Netlify Dashboard (https://app.netlify.com/start) via one-click GitHub integration."
          fi
