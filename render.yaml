services:
  - type: web
    name: cuda-raytracer-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    startCommand: python -u backend/server.py
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GPU_WORKER_URL
        sync: false
